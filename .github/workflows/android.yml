name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Получаем код репозитория
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Устанавливаем JDK 17 (требуется для Kotlin + AGP 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Даём права на выполнение gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Кешируем зависимости Gradle (ускоряет повторные сборки)
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Собираем debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 6. Загружаем APK как артефакт (можно скачать с вкладки Actions)
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WaterMeterApp-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # Опциональный job: сборка Release APK (без подписи)
  build-release:
    name: Build Release APK (unsigned)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: WaterMeterApp-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
