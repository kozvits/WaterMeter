name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Код репозитория
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. gradle/actions/setup-gradle — официальный action от команды Gradle.
      #    Автоматически скачивает gradle-wrapper.jar, кеширует дистрибутив и зависимости.
      #    Именно он решает ошибку "Could not find GradleWrapperMain".
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Права на gradlew (обязательно на Linux runner)
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 5. Сборка Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 6. Сохраняем APK как артефакт (Artifacts → скачать на вкладке Actions)
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WaterMeterApp-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  build-release:
    name: Build Release APK (unsigned)
    runs-on: ubuntu-latest
    # Запускается только при пуше в main/master, после успешного debug-билда
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: WaterMeterApp-release-unsigned-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
